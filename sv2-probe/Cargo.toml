[package]
name = "stratum_v2_probe"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Stratum V2 health probe for Zabbix"

[dependencies]
bs58 = { version = "0.5", features = ["check"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.44", features = ["macros", "net", "rt-multi-thread", "time"] }
stratum-apps = { version = "0.7.0", default-features = false, features = ["network", "core", "std"] }

